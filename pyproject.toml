[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qfabric"
version = "0.2.1"
description = "Research prototype for deadline- and memory-aware quantum-network orchestration"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
sequence = ["sequence==1.3.1"]

[project.scripts]
qfabric-demo = "qfabric.demo:main"
qfabric-sequence-smoke = "qfabric.sequence_smoke:main"
qfabric-benchmark = "qfabric.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
